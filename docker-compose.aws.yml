services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SEED_DEMO_DATA: 'false'
      COOKIE_SECURE: 'true'
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env.aws}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.aws}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.aws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.aws}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.aws}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env.aws}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env.aws}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-ContinuityOS Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env.aws}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env.aws}
      ATTACHMENTS_BUCKET: ${ATTACHMENTS_BUCKET:?Set ATTACHMENTS_BUCKET in .env.aws}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION in .env.aws}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
